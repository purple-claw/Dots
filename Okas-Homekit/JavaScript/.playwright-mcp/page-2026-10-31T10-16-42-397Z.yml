  - heading "Try these three" [level=2] [ref=f1e172]
  - list [ref=f1e173]:
    - listitem [ref=f1e174]: Job takes 35 ms, spawn every 10 ms → peak is 4. New jobs arrive faster than old ones leave, so they pile up — but the pile has a ceiling.
    - listitem [ref=f1e175]: Job takes 10 ms, spawn every 35 ms → peak drops to 1. Each job finishes long before the next one is born; nothing ever overlaps.
    - listitem [ref=f1e176]: Job takes 100 ms, spawn every 10 ms → peak jumps to 10. Same 14 lines of code, ten times the memory held at once. Nothing in the code changed — only the two numbers on lines 9 and 13.
  - heading "Payoff" [level=2] [ref=f1e177]
  - paragraph [ref=f1e178]:
    - text: Peak overlap ≈
    - code [ref=f1e179]: ceil(job time ÷ spawn interval)
    - text: . With 35 ÷ 10 that is
    - code [ref=f1e180]: ceil(3.5) = 4
    - text: ". The real file never prints this, which is the quiet lesson:"
    - code [ref=f1e181]: mxRng
    - text: on line 8 is the only thing measuring it, and it is thrown away. Swap in a slower job and the same code silently holds 10, 20, 100 jobs in memory.
